# Serves the built add-in behind the VPS's existing Traefik: no host ports, routed by labels.
# Values come from .env in this folder (see .env.example).
services:
  web:
    build:
      context: .
      args:
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:?set VITE_ENTRA_CLIENT_ID in .env}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
        ADDIN_PROD_URL: ${ADDIN_PROD_URL:?set ADDIN_PROD_URL in .env}
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env}
      - traefik.http.routers.mail-assistant-addin.rule=Host(`${ADDIN_HOST:?set ADDIN_HOST in .env}`)
      - traefik.http.routers.mail-assistant-addin.entrypoints=${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT in .env}
      - traefik.http.routers.mail-assistant-addin.tls.certresolver=${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in .env}
      - traefik.http.services.mail-assistant-addin.loadbalancer.server.port=80

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
